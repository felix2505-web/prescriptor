# Arranque local o en un servidor:  docker compose up -d
# API en http://localhost:8000  ·  documentación interactiva en http://localhost:8000/docs
services:
  api:
    # Para usar la imagen publicada en ghcr.io en vez de construirla, cambia "build" por:
    # image: ghcr.io/prescriptordji/prescriptor-backend:latest
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://prescriptor:${POSTGRES_PASSWORD}@db:5432/prescriptor
      DATA_DIR: /data
    volumes:
      - datos:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: prescriptor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: prescriptor
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prescriptor"]
      interval: 5s
      retries: 10
    restart: unless-stopped

volumes:
  datos:
  postgres:
